appId: org.railwatch.railwatch12306
productName: RailWatch 12306
publish:
  provider: github
  owner: shyrel666
  repo: RailWatch-12306
directories:
  output: release
files:
  - dist/**/*
  - dist-electron/**/*
  - assets/images/icon.ico
  - assets/images/icon.png
  - package.json
extraResources:
  - from: dist-runtime
    to: railwatch-runtime
    filter:
      - "**/*"
win:
  icon: assets/images/icon.ico
  target:
    - nsis
  artifactName: "RailWatch-12306-${version}-${arch}.${ext}"
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
mac:
  icon: assets/images/icon.png
  category: public.app-category.travel
  minimumSystemVersion: "12.0"
  target:
    - dmg
    - zip
  artifactName: "RailWatch-12306-${version}-${arch}.${ext}"
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: assets/mac/entitlements.mac.plist
  entitlementsInherit: assets/mac/entitlements.mac.plist
dmg:
  artifactName: "RailWatch-12306-${version}-${arch}.${ext}"
